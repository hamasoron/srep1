# nameセクション（ワークフローの名前を指定）
name: API Python CI/CD

# onセクション（ワークフローのトリガーを指定）
on:
  ## mainブランチにプッシュされた時に自動実行（api/配下や.github/workflows/api-python-cicd.ymlが対象）
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/api-python-cicd.yml'
  ## GitHubの画面から手動で実行ボタンを押した時に実行
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ環境（prod/stg/dev）'
        ### 入力が必須であることを指定
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - stg
          - dev

# jobsセクション（ワークフローの実行内容を指定）
jobs:
  ## job名（detect-environment:実行環境prod/stg/devを判定して検出後、outputsで出力）
  detect-environment:
    name: Detect Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - id: set-env
        ### stepsのrunセクション（シェルスクリプトを実行）
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            #### github上でinputsで指定した環境を出力（別のjobで使用するため）
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            # pushの場合はmainブランチなのでprod環境
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

  ## job名（build-and-push:ビルドしたイメージをECRにpush）
  build-and-push:
    name: Build and Push to ECR
    needs: detect-environment
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
      AWS_REGION: ap-northeast-1

    steps:
      - name: Checkout code
        ### stepsのusesセクション（GitHub Actionsのアクションを使用）
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        ### stepsのusersセクション（GitHub Actionsのアクションを使用）
        uses: aws-actions/configure-aws-credentials@v2
        ### stepsのwithセクション（GitHub Actionsのアクションのパラメータを指定）
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR Repository name
        id: set-ecr-repo
        ### stepsのrunセクション（シェルスクリプトを実行）
        run: |
          #### シェル変数を定義
          ECR_REPOSITORY="srep1-${{ env.ENVIRONMENT }}-api-python-repo"
          #### シェル変数を出力（別のjobで使用するため）
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        id: login-ecr
        ### stepsのusesセクション（GitHub ActionsのActionを使用）
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        ### stepsのworking-directoryセクション（シェルスクリプトの実行場所をルートディレクトリからの相対パスで指定）
        working-directory: ./api-python
        ### stepsのrunセクション（シェルスクリプトを実行）
        run: |
          #### タグを付けてイメージをビルド
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          #### 別のタグを付けてイメージをビルド
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          #### 旧タグがついたイメージをECRにpush
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          #### 新タグがついたイメージをECRにpush
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          #### 旧タグがついたイメージを出力（別のjobで使用するため）
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT