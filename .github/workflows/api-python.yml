## nameセクション（ワークフローの名前を定義）
name: api-python

# onセクション（ワークフローのトリガーを定義）
on:
  ## main/release/developブランチにプッシュされた時に自動実行（api-python/配下や.github/workflows/api-python.ymlが対象）
  push:
    branches:
      - main
      - release
      - develop
    paths:
      - 'app/api-python/*'
      - '.github/workflows/api-python.yml'
  ## GitHub Actionsの画面から実行ボタンを押した時に手動実行
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ環境（prod/stg/dev）'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - stg
          - dev

# jobsセクション（ワークフローの処理を定義）
jobs:
  ## job名（detect-environment:実行環境prod/stg/devを判定して検出後、outputsで出力）
  detect-environment: ### 論理名
    name: Detect Environment ### 表示名
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - id: set-env
        ### stepsのrunセクション（シェルスクリプトを実行）
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            #### github上でinputsで指定した環境を出力（別のjobで使用するため）
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/release" ]; then
            echo "environment=stg" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=unknown" >> $GITHUB_OUTPUT
          fi

  ## job名（build-and-push:ビルドしたイメージをECRにpush）
  build-and-push:
    name: Build and Push
    ### needsフィールド（build-and-pushjobを実行する前にdetect-environmentjobの実行が必要）
    needs: detect-environment
    runs-on: ubuntu-latest
    ### permissionsフィールド（GitHub Actionsのアクションを実行するための権限）
    permissions:
      #### id-token: write（クラウドにアクセスするためのトークンを生成）
      id-token: write
      #### contents: read（リポジトリの読み込み）
      contents: read
    env:
      #### 前のjobで出力された環境を取得
      ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
      AWS_REGION: ap-northeast-1
    outputs:
      ecr_registry: ${{ steps.build-image.outputs.ecr_registry }}
      ecr_repository: ${{ steps.build-image.outputs.ecr_repository }}
      image_tag: ${{ steps.build-image.outputs.image_tag }}
    steps:
        ### stepsのnameセクション（ステップの名前を定義）
      - name: Checkout code
        ### stepsのusesセクション（GitHub Actionsのアクションを使用）
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR Repository name
        id: set-ecr-repo
        ### stepsのrunセクション（シェルスクリプトを実行）
        run: |
          #### シェル変数を定義
          ECR_REPOSITORY="srep1-${{ env.ENVIRONMENT }}-api-python-repo"
          #### シェル変数を出力（別のjobで使用するため）
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        id: login-ecr
        ### stepsのusesセクション（GitHub ActionsのActionを使用）
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        ### stepsのworking-directoryセクション（シェルスクリプトの実行場所をルートディレクトリからの相対パスで指定）
        working-directory: ./app/api-python
        ### stepsのrunセクション（シェルスクリプトを実行）
        run: |
          # デバッグ情報を出力
          echo "ECR_REGISTRY: $ECR_REGISTRY"
          echo "ECR_REPOSITORY: $ECR_REPOSITORY"
          echo "IMAGE_TAG: $IMAGE_TAG"

          #### タグを付けてイメージをビルド
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          #### 別のタグを付けてイメージをビルド
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          #### 旧タグがついたイメージをECRにpush
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          #### 新タグがついたイメージをECRにpush
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          #### イメージのパーツを個別に出力
          echo "ecr_registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT
          echo "ecr_repository=$ECR_REPOSITORY" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          
          # 最終的なイメージURIを確認
          echo "Full Image URI: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  ## ECSにデプロイするジョブ
  deploy:
    name: Deploy to ECS
    needs: [detect-environment, build-and-push]
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
      AWS_REGION: ap-northeast-1
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Construct image URI
        id: image-uri
        run: |
          REGISTRY="${{ needs.build-and-push.outputs.ecr_registry }}"
          REPO="${{ needs.build-and-push.outputs.ecr_repository }}"
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          
          # ECRの完全なURIを構築
          # 通常、ECRレジストリURIは "accountID.dkr.ecr.region.amazonaws.com" の形式
          # レジストリが末尾の / を持っていないことを確認
          REGISTRY=$(echo $REGISTRY | sed 's#/$##')
          
          # 完全なイメージURIを構築
          IMAGE_URI="$REGISTRY/$REPO:$TAG"
          
          echo "URI=$IMAGE_URI" >> $GITHUB_OUTPUT
          # デバッグ情報を出力
          echo "Registry: $REGISTRY"
          echo "Repository: $REPO"
          echo "Tag: $TAG"
          echo "Full Image URI: $IMAGE_URI"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Manually modify task definition
        id: manual-task-def
        run: |
          # 元のタスク定義ファイルを読み込む
          TASK_DEF_FILE="srep1-${{ env.ENVIRONMENT }}-api-python-taskdef.json"
          IMAGE_URI="${{ steps.image-uri.outputs.URI }}"
          
          echo "Original task definition file:"
          cat $TASK_DEF_FILE
          
          # 一時ファイルを作成
          TEMP_TASK_DEF=$(mktemp)
          
          # jqを使用してイメージを置き換え
          jq --arg IMAGE "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE' $TASK_DEF_FILE > $TEMP_TASK_DEF
          
          # 新しいファイル名
          NEW_TASK_DEF_FILE="task-def-$(date +%s).json"
          cp $TEMP_TASK_DEF $NEW_TASK_DEF_FILE
          
          # 出力ファイル名を設定
          echo "file=$NEW_TASK_DEF_FILE" >> $GITHUB_OUTPUT
          
          # デバッグ出力
          echo "Updated task definition file content:"
          cat $NEW_TASK_DEF_FILE

      - name: Deploy with AWS CLI
        run: |
          # 修正されたタスク定義ファイルを使用して直接 ECS にデプロイ
          TASK_DEF_FILE="${{ steps.manual-task-def.outputs.file }}"
          
          echo "Task definition file content before registration:"
          cat $TASK_DEF_FILE
          
          echo "Registering task definition using AWS CLI..."
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://$TASK_DEF_FILE --query 'taskDefinition.taskDefinitionArn' --output text)
          
          echo "Task definition registered: $TASK_DEF_ARN"
          
          echo "Updating service..."
          aws ecs update-service \
            --cluster srep1-${{ env.ENVIRONMENT }}-cluster \
            --service srep1-${{ env.ENVIRONMENT }}-api-python-svc \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment 