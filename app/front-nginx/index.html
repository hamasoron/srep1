<!-- HTML5の宣言 -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- 文字コードの設定 -->
    <meta charset="UTF-8">
    <!-- レスポンシブデザイン対応のためのビューポート設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ページタイトル -->
    <title>AWS認定資格</title>
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- メインコンテナ -->
    <div class="container">
        <!-- ヘッダーセクション -->
        <header>
            <h1>AWS認定資格</h1>
        </header>
        
        <!-- メインコンテンツ -->
        <main>
            <!-- API接続テストセクション -->
            <section class="api-test">
                <h2>ECS接続テスト</h2>
                <!-- テスト実行ボタン -->
                <div class="buttons">
                    <button onclick="testAPI()">API接続テスト</button>
                    <button onclick="testDB()">DB接続テスト</button>
                </div>
                <!-- レスポンス表示エリア -->
                <div class="response-box">
                    <p id="response">ボタンをクリックしてテストを実行してください</p>
                </div>
            </section>
        </main>
        
        <!-- フッターセクション -->
        <footer>
            <p>© 2025 AWS認定資格ガイド</p>
        </footer>
    </div>
    
    <!-- JavaScriptファイルの読み込み -->
    <script src="script.js"></script>
</body>
</html>
