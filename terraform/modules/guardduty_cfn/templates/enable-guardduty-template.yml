# CloudFormation Template for Enable Amazon GuardDuty across all regions
AWSTemplateFormatVersion: '2010-09-09'
Description: Enable Amazon GuardDuty across all regions

Parameters:
  FindingPublishingFrequency:
    Type: String
    Description: 'Frequency for publishing findings'
    AllowedValues: ['FIFTEEN_MINUTES', 'ONE_HOUR', 'SIX_HOURS']

  EBSMalwareProtection:
    Type: String
    Description: 'Enable EBS malware protection'
    AllowedValues: ['ENABLED', 'DISABLED']
  
  EKSAuditLogs:
    Type: String
    Description: 'Enable EKS audit logs monitoring'
    AllowedValues: ['ENABLED', 'DISABLED']
  
  LambdaProtection:
    Type: String
    Description: 'Enable Lambda network logs protection'
    AllowedValues: ['ENABLED', 'DISABLED']
  
  RDSProtection:
    Type: String
    Description: 'Enable RDS login events protection'
    AllowedValues: ['ENABLED', 'DISABLED']
  
  S3Protection:
    Type: String
    Description: 'Enable S3 data events protection'
    AllowedValues: ['ENABLED', 'DISABLED']
  
  RuntimeMonitoring:
    Type: String
    Description: 'Enable runtime monitoring'
    AllowedValues: ['ENABLED', 'DISABLED']
  
Resources:
  GuardDutyDetector:
    Type: 'AWS::GuardDuty::Detector'
    Properties:
      Enable: true
      FindingPublishingFrequency: !Ref FindingPublishingFrequency
      Features:
        # EBS malware protection
        - Name: 'EBS_MALWARE_PROTECTION'
          Status: !Ref EBSMalwareProtection
        
        # EKS audit logs
        - Name: 'EKS_AUDIT_LOGS'
          Status: !Ref EKSAuditLogs
        
        # Lambda network logs
        - Name: 'LAMBDA_NETWORK_LOGS'
          Status: !Ref LambdaProtection

        # RDS login events
        - Name: 'RDS_LOGIN_EVENTS'
          Status: !Ref RDSProtection
        
        # S3 data events protection
        - Name: 'S3_DATA_EVENTS'
          Status: !Ref S3Protection
        
        # Runtime monitoring
        - Name: 'RUNTIME_MONITORING'
          Status: !Ref RuntimeMonitoring
          AdditionalConfiguration:
            # EKS addon management
            - Name: 'EKS_ADDON_MANAGEMENT'
              Status: 'DISABLED'
            # ECS Fargate agent management
            - Name: 'ECS_FARGATE_AGENT_MANAGEMENT'
              Status: 'ENABLED' # EC2 agent management - Name: 'EC2_AGENT_MANAGEMENT'
            # EC2 agent management
            - Name: 'EC2_AGENT_MANAGEMENT'
              Status: 'DISABLED'

Outputs:
  GuardDutyDetectorId:
    Description: 'The unique ID of the GuardDuty detector'
    Value: !Ref GuardDutyDetector
    Export:
      Name: !Sub '${AWS::StackName}-GuardDutyDetectorId'
  
  GuardDutyDetectorArn:
    Description: 'The ARN of the GuardDuty detector'
    Value: !Sub 'arn:aws:guardduty:${AWS::Region}:${AWS::AccountId}:detector/${GuardDutyDetector}'
    Export:
      Name: !Sub '${AWS::StackName}-GuardDutyDetectorArn'
  
  Region:
    Description: 'The AWS region where GuardDuty is enabled'
    Value: !Ref 'AWS::Region'
    Export:
      Name: !Sub '${AWS::StackName}-Region' 