# Nginxサーバの設定ブロック
server {
    # HTTPの80番ポートでクライアントからのリクエスト待ち受ける（待ち受けポート）
    listen 80;
    # サーバ名を指定。ワイルドカード「_」は、全てのホスト名とIPアドレスを待ち受ける
    server_name _;
    
    # ルートディレクトリへのリクエストを処理するブロック 
    location / {
        # ルートディレクトリ（ドキュメントルート）を指定
        root /usr/share/nginx/html;
        # インデックスファイル（デフォルトのファイル名）を指定
        index index.html;
        # リクエストされたファイルがルートディレクトリに見つからない場合、index.htmlにリダイレクト（404エラーを回避）
        try_files $uri $uri/ /index.html;
    }

    # APIリクエストをPythonコンテナに転送
    location /api/ {
        proxy_pass http://python-app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CORSヘッダー設定
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
}
